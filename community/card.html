<!DOCTYPE html>
<!-- Facebook card template. The bot fills the {{placeholders}} and screenshots it with headless Chrome.
     Edit freely: colours, fonts and layout. Card size and brand texts are in config.py (CARD). -->
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block">
<style>
  :root { --blue: {{blue}}; --yellow: {{yellow}}; --dark: {{dark}}; --w: {{width}}px; --h: {{height}}px;
          --band: {{band}}px; --band-color: {{band_color}}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: calc(var(--w) + 2 * var(--band)); height: var(--h); overflow: hidden; }
  /* side bands like the Canadian flag (red | card | red); CARD["band"] = 0 turns them off */
  body { background: var(--band-color); padding: 0 var(--band); }
  body { font-family: "Montserrat", "Inter", "DejaVu Sans", sans-serif; color: #fff; background: var(--band-color); }
  .leaf-l, .leaf-r { position: absolute; top: 50%; width: calc(var(--band) * .74); fill: #fff;
                     transform: translate(-50%, -50%); }
  .leaf-l { left: calc(var(--band) * .45); } .leaf-r { left: calc(100% - var(--band) * .45); }
  .card { position: relative; width: var(--w); height: 100%; overflow: hidden;
          box-shadow: 0 0 0 calc(var(--band) * .12) #fff;
          background: radial-gradient(120% 90% at 85% 0%, var(--blue) 0%, var(--dark) 70%); }
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center 30%; }
  .shade { position: absolute; inset: 0;
           background: linear-gradient(180deg, rgba(8,18,40,.55) 0%, rgba(8,18,40,0) 22%,
                                       rgba(8,18,40,.15) 42%, rgba(8,18,40,.88) 68%, rgba(8,18,40,.97) 100%); }
  .leaf { position: absolute; right: -120px; top: 120px; width: 760px; opacity: .07; fill: #fff; }
  .top { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; align-items: center;
         justify-content: space-between; font-weight: 700; font-size: 30px; letter-spacing: .04em; }
  .brand { display: flex; align-items: center; gap: 18px; text-transform: uppercase; }
  .brand small { display: block; font-size: 22px; font-weight: 500; letter-spacing: .02em; text-transform: none;
                 opacity: .85; margin-top: 4px; }
  .brand small:empty { display: none; }
  .flag { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: flex; flex-direction: column;
          box-shadow: 0 0 0 3px rgba(255,255,255,.9); }
  .flag i { flex: 1; } .flag i:first-child { background: #0057B7; } .flag i:last-child { background: #FFD700; }
  .date { opacity: .9; font-weight: 500; }
  .bottom { position: absolute; left: 64px; right: 64px; bottom: 64px; }
  .tag { display: inline-block; background: var(--yellow); color: var(--dark); font-weight: 800; font-size: 28px;
         letter-spacing: .06em; text-transform: uppercase; padding: 12px 22px; border-radius: 8px; margin-bottom: 30px; }
  h1 { font-weight: 800; font-size: 76px; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance;
       text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  .footer { margin-top: 44px; padding-top: 28px; border-top: 4px solid var(--yellow); display: flex;
            justify-content: space-between; font-size: 30px; font-weight: 700; }
  .footer span:last-child { opacity: .8; font-weight: 500; }
  .footer .cta { color: var(--yellow); font-weight: 800; }
  .credit { position: absolute; right: 22px; top: 50%; transform: rotate(-90deg) translateX(50%);
            transform-origin: right top; font-size: 18px; opacity: .55; white-space: nowrap; }

  /* morning digest: a list instead of a photo */
  .digest h1 { font-size: 66px; }
  .digest ol { list-style: none; margin-top: 40px; counter-reset: n; }
  .digest li { counter-increment: n; position: relative; padding: 24px 0 24px 92px; font-size: 38px;
               font-weight: 700; line-height: 1.22; border-top: 2px solid rgba(255,255,255,.18); }
  .digest li::before { content: counter(n); position: absolute; left: 0; top: 20px; width: 62px; height: 62px;
                       border-radius: 50%; background: var(--yellow); color: var(--dark); font-weight: 800;
                       font-size: 34px; display: flex; align-items: center; justify-content: center; }

  /* this day in history: the date is the hero */
  .bigdate { font-weight: 800; font-size: 150px; line-height: .95; color: var(--yellow); letter-spacing: -.02em;
             text-transform: uppercase; margin-bottom: 26px; text-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .bigdate small { display: block; font-size: 64px; color: #fff; letter-spacing: .02em; margin-top: 10px; }
  .community .tag { background: #0057B7; color: #fff; box-shadow: inset 14px 0 0 #FFD700; padding-left: 36px; }

  /* no photo: the text fills the card, with an embroidery-style ornament band */
  .ornament { display: none; }
  .nophoto .ornament { display: block; position: absolute; left: 0; right: 0; top: 160px; height: 72px; opacity: .5;
    background:
      linear-gradient(45deg, transparent 37%, var(--yellow) 37% 63%, transparent 63%) 0 0 / 48px 48px,
      linear-gradient(-45deg, transparent 37%, var(--yellow) 37% 63%, transparent 63%) 0 0 / 48px 48px,
      linear-gradient(45deg, transparent 37%, #e0423a 37% 63%, transparent 63%) 24px 24px / 48px 48px,
      linear-gradient(-45deg, transparent 37%, #e0423a 37% 63%, transparent 63%) 24px 24px / 48px 48px; }
  .nophoto .bottom { top: 270px; display: flex; flex-direction: column; }
  .nophoto .main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .nophoto h1 { font-size: 98px; line-height: 1.08; }
  .nophoto.digest h1 { font-size: 76px; }
  .nophoto .tag { font-size: 32px; }

  /* with a photo: the picture fills the top, the text sits on a solid panel below (the photo stays visible) */
  .withphoto { display: flex; flex-direction: column; }
  .withphoto .pic { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .withphoto .shade { background: linear-gradient(180deg, rgba(8,18,40,.6) 0%, rgba(8,18,40,0) 20%,
                                                  rgba(8,18,40,0) 82%, var(--dark) 100%); }
  .withphoto .bottom { position: relative; left: auto; right: auto; bottom: auto; background: var(--dark);
                       padding: 8px 64px 56px; }
  .withphoto .tag { margin-bottom: 22px; }
  .withphoto h1 { font-size: 72px; text-shadow: none; }  /* the starting size: long headlines shrink to fit */
  .withphoto .footer { margin-top: 34px; padding-top: 24px; }
  .withphoto .bigdate { font-size: 88px; display: flex; align-items: baseline; gap: 22px; margin-bottom: 18px; }
  .withphoto .bigdate small { display: inline; font-size: 48px; margin: 0; }
  .nophoto .pic { display: none; }
</style>
</head>
<body>
{{leaves}}
<div class="card {{kind}} {{layout}}">
  <div class="ornament"></div>
  <div class="pic">{{background}}<div class="shade"></div>{{credit}}</div>
  <div class="top">
    <div class="brand"><div class="flag"><i></i><i></i></div><div>{{brand}}<small>{{tagline}}</small></div></div>
    <div class="date">{{date}}</div>
  </div>
  <div class="bottom">
    <div class="main">
      {{bigdate}}
      {{tag}}
      <h1 id="title">{{title}}</h1>
      {{items}}
    </div>
    <div class="footer"><span><b class="cta">{{cta}}</b> {{handle}}</span><span>{{handle2}}</span></div>
  </div>
</div>
<script>
  // shrink the headline (and the digest list) until everything fits on the card
  const fit = () => {
    const h1 = document.getElementById('title'), bottom = document.querySelector('.bottom');
    let size = parseFloat(getComputedStyle(h1).fontSize), li = document.querySelectorAll('li');
    let liSize = li.length ? parseFloat(getComputedStyle(li[0]).fontSize) : 0;
    const main = document.querySelector('.main'), nophoto = document.querySelector('.nophoto');
    const pic = document.querySelector('.withphoto .pic');
    const tooBig = () => nophoto ? main.scrollHeight > main.clientHeight + 1
                                 : pic.getBoundingClientRect().height < 720;
    // with a photo, a long headline also shrinks (down to 58px) until it takes at most four lines
    const tooLong = () => !nophoto && size > 58 && h1.offsetHeight > size * 1.12 * 4 + 2;
    while ((tooBig() || tooLong()) && size > 34) {
      size -= 2; h1.style.fontSize = size + 'px';
      if (liSize > 26) { liSize -= 1; li.forEach(x => x.style.fontSize = liSize + 'px'); }
    }
  };
  document.fonts.ready.then(fit);
</script>
</body>
</html>

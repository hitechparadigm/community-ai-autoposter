name: Draft posts

on:
  schedule:
    - cron: "0 12,15,18,21 * * *"   # 7:00, 10:00, 13:00, 16:00 Toronto time (winter)
    - cron: "0 0 * * *"             # 19:00 Toronto time
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and send drafts
        run: python3 bot.py draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      - name: Save state
        if: always()
        run: bash save_state.sh

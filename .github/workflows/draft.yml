name: Draft posts

on:
  workflow_call:
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write


jobs:
  draft:
    runs-on: ubuntu-latest
    concurrency:
      group: news
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and send drafts
        run: python3 bot.py draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      - name: Save state
        if: always()
        run: bash save_state.sh

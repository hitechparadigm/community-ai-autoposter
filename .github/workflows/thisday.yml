name: Draft this-day post

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  thisday:
    runs-on: ubuntu-latest
    concurrency:
      group: thisday
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write a this-day-in-history post
        run: python3 bot.py thisday
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

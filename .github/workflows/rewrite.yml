name: Rewrite a published long-read

# Rewrites an already published Telegraph article in place (the link stays the same),
# using the current prompts and style guide.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Telegraph page: the part after telegra.ph/ in its link"
        required: true
      source:
        description: "Source: a web page URL, or wiki:Article title (English Wikipedia). Leave empty to only move the opening photo below the first paragraph (shows it whole in Instant View)"
        required: false
        default: ""

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite
        run: if [ -z "$SOURCE" ]; then python3 bot.py move-photo "$PAGE"; else python3 bot.py rewrite "$PAGE" "$SOURCE"; fi
        env:
          PAGE: ${{ inputs.page }}
          SOURCE: ${{ inputs.source }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}

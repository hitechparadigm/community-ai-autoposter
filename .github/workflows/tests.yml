name: Tests

on:
  push:
    paths: ["**.py", "glossary.json", "card.html", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit and flow tests (standard library only)
        run: python3 -m unittest discover -s tests -v
      - name: Every module compiles
        run: python3 -m compileall -q autoposter bot.py config.py prompts.py

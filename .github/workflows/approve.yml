name: Publish approved posts

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  approve:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-updates
      cancel-in-progress: false
    timeout-minutes: 5
    env:
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}   # access to the private <repo>-state repository (optional)
    steps:
      - uses: actions/checkout@v4
      - name: Get the bot's memory from the private state repository
        if: env.STATE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-state
          token: ${{ env.STATE_TOKEN }}
          path: .state
      - name: Check taps and publish
        run: python3 bot.py approve
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

name: Monthly review

on:
  workflow_dispatch:           # runs by itself on REVIEW_DAY (config.py); use this to run it now

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    concurrency:
      group: news
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Review last month's feedback and reader reactions
        run: python3 bot.py review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

name: Check connections

on:
  workflow_dispatch:
    inputs:
      test_feeds:
        description: "Optional: feeds to try, as Name|URL separated by spaces"
        required: false           # run by hand after adding or changing secrets; posts nothing

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram and Facebook
        run: python3 bot.py check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TEST_FEEDS: ${{ inputs.test_feeds }}

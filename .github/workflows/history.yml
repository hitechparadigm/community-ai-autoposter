name: Draft history story

on:
  schedule:
    - cron: "30 16 * * *"   # 11:30 Toronto time (winter)
  workflow_dispatch:
    inputs:
      ukrainian:
        description: "Ukrainian-Canadian story (otherwise it's only on Sundays)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write a Canadian history story
        run: python3 bot.py history ${{ inputs.ukrainian && 'ukrainian' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

name: Draft history story

on:
  workflow_dispatch:
    inputs:
      community:
        description: "Community-history story (otherwise only on COMMUNITY_HISTORY_DAY, Sundays)"
        type: boolean
        default: false

permissions:
  contents: write


jobs:
  history:
    runs-on: ubuntu-latest
    concurrency:
      group: history
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write a Canadian history story
        run: python3 bot.py history ${{ inputs.community && 'community' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

name: Tick (every 5 minutes)

# Runs what is due by SCHEDULE in config.py (local time) and publishes approved posts.
# GitHub runs schedules on behalf of the person who last changed the cron line below,
# so the repository owner should be the last one to edit it.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:      # also lets an external timer (e.g. cron-job.org) start it

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-updates   # one reader of Telegram button taps at a time
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run due jobs and publish
        run: python3 bot.py tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh

name: Tick (every 5 minutes)

# Runs what is due by SCHEDULE in config.py (local time) and publishes approved posts.
# This is the ManitobaBotNews branch. GitHub only runs "schedule" triggers from the default branch,
# so there is no cron here: an external timer (cron-job.org) starts this workflow every 5 minutes with
# POST /repos/hitechparadigm/community-ai-autoposter/actions/workflows/tick.yml/dispatches
# and body {"ref": "ManitobaBotNews"}.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    environment: manitoba
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-updates-manitoba   # one reader of Telegram button taps at a time
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run due jobs and publish
        run: python3 bot.py tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Save state
        if: always()
        run: bash save_state.sh
